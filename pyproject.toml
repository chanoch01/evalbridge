[project]
name = "evalbridge"
version = "0.1.0"
description = "Do your offline LLM evals predict what users prefer? Judge report cards and ship/kill/test decisions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",            # reads the MT-Bench parquet files
]

[project.optional-dependencies]
# Bridge study and statistics package (Weeks 2-3)
stats = ["scipy>=1.13", "statsmodels>=0.14"]
# Live assistant and event pipeline (Week 4)
live = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "redis>=5",
    "clickhouse-connect>=0.8",
]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
evalbridge = "evalbridge.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evalbridge = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: downloads from Hugging Face"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
