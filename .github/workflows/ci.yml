name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    # Lint, unit tests and a report card on the synthetic fixture. No network, no API keys.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest
      - run: evalbridge report --judge longer --fixture --out reports/demo
